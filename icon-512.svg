<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.4" />
    </filter>
  </defs>
  
  <!-- Background with smooth rounded square for app launcher -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Subtle inner geometric grid / compass ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="120" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="2" />

  <!-- Central Symbol: Graduation Cap + Question Mark & Checkmark Badge -->
  <g filter="url(#dropShadow)">
    <!-- Graduation Cap Top -->
    <polygon points="256,120 400,190 256,260 112,190" fill="#ffffff" />
    <!-- Graduation Cap Lower Underlay -->
    <path d="M160,215 L160,290 C160,340 352,340 352,290 L352,215 L256,262 Z" fill="#e0e7ff" />
    <!-- Tassel -->
    <path d="M380,200 L396,270 C396,280 388,290 380,290 C372,290 364,280 364,270 Z" fill="#fbbf24" />
    <circle cx="256" cy="190" r="8" fill="#4338ca" />
  </g>

  <!-- Math & Target Badge at Bottom Right -->
  <g transform="translate(310, 310)" filter="url(#dropShadow)">
    <circle cx="70" cy="70" r="64" fill="#10b981" stroke="#ffffff" stroke-width="8" />
    <!-- Checkmark -->
    <path d="M46,72 L62,88 L96,52" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Formula accent at Bottom Left: √x = y -->
  <g transform="translate(90, 360)">
    <rect x="0" y="0" width="130" height="42" rx="21" fill="#1e1b4b" fill-opacity="0.6" stroke="#818cf8" stroke-width="2" />
    <text x="65" y="27" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle" letter-spacing="1">f(x) = çöz</text>
  </g>
</svg>
